name: Build and Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyinstaller

      - name: Build binary
        run: |
          pyinstaller \
            --onefile \
            --name tomodoro \
            --add-data "tomodoro/sounds:tomodoro/sounds" \
            --hidden-import tomodoro \
            --hidden-import tomodoro.ui \
            --hidden-import tomodoro.timer \
            --hidden-import tomodoro.config \
            --hidden-import tomodoro.stats \
            --hidden-import tomodoro.art \
            --hidden-import tomodoro.brightness \
            --hidden-import tomodoro.keyboard_backlight \
            --hidden-import tomodoro.sounds \
            entry.py

      - name: Rename artifact
        run: mv dist/tomodoro dist/tomodoro-macos

      - name: Generate version tag
        id: version
        run: |
          VERSION="v1.0.0-build.${{ github.run_number }}"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compute SHA256
        id: sha
        run: |
          SHA=$(shasum -a 256 dist/tomodoro-macos | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Tomodoro ${{ steps.version.outputs.tag }}
          body: |
            Automated build from commit ${{ github.sha }}.

            ### Install via Homebrew
            ```bash
            brew install uherman/tomodoro/tomodoro
            ```

            ### Manual download
            Download `tomodoro-macos` below and run:
            ```bash
            chmod +x tomodoro-macos
            ./tomodoro-macos
            ```
          files: dist/tomodoro-macos
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew formula
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          SHA="${{ steps.sha.outputs.sha256 }}"
          URL="https://github.com/uherman/tomodoro/releases/download/${TAG}/tomodoro-macos"

          git clone https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/uherman/homebrew-tomodoro.git tap
          cd tap

          mkdir -p Formula
          cat > Formula/tomodoro.rb << FORMULA
          class Tomodoro < Formula
            desc "Terminal-based pomodoro timer with ASCII tomato art"
            homepage "https://github.com/uherman/tomodoro"
            url "${URL}"
            sha256 "${SHA}"
            license "MIT"
            version "${TAG}"

            depends_on :macos

            def install
              bin.install "tomodoro-macos" => "tomodoro"
            end

            test do
              assert_match "tomodoro", shell_output("#{bin}/tomodoro --help 2>&1", 1)
            end
          end
          FORMULA

          # Remove leading whitespace from heredoc
          sed -i '' 's/^          //' Formula/tomodoro.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/tomodoro.rb
          git commit -m "Update tomodoro to ${TAG}" || exit 0
          git push
